[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-image-board"
version = "0.4.0"
description = "Snappy React selectable image board for Streamlit (Components v2)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "George Siogkas", email = "gsiogkas@cvrlab.com" },
]
dependencies = [
  "streamlit>=1.51",
  "pillow",
]

[project.urls]
Homepage = "https://github.com/gsiogkas/streamlit-image-board"
Repository = "https://github.com/gsiogkas/streamlit-image-board"

[project.optional-dependencies]
aggrid = ["pandas", "streamlit-aggrid>=0.3.4"]
aggrid-v2 = ["pandas", "streamlit-aggrid-v2>=0.3.4"]
devel = ["wheel", "pytest", "pandas"]

[dependency-groups]
dev = ["wheel", "pytest", "pandas"]

[tool.setuptools.packages.find]
include = ["streamlit_image_board*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
streamlit_image_board = ["frontend/build/**/*", "pyproject.toml"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["streamlit_image_board", "tests", "app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
